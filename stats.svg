<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250">
<defs>
  <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="860" y2="250">
    <stop offset="0" stop-color="#ff3cac"/><stop offset="0.5" stop-color="#784ba0"/><stop offset="1" stop-color="#2de2e6"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 430.0 125.0" to="360 430.0 125.0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3cac"/><stop offset="1" stop-color="#2de2e6"/>
  </linearGradient>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
  .in { animation: in 0.6s ease-out backwards; }
  .bar { transform-box: fill-box; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes in { from { opacity: 0; transform: translateX(-8px); } }
  @keyframes grow { from { transform: scaleX(0); } }
</style>
<rect x="4" y="4" width="852" height="242" rx="14" fill="none" stroke="url(#border)" stroke-width="4" filter="url(#soft)" opacity="0.8"/>
<rect x="4" y="4" width="852" height="242" rx="14" fill="#0d1117" stroke="url(#border)" stroke-width="1.5"/>

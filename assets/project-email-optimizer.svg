<text x="24" y="164" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">Multi-account email client for bulk spam filtering.</text><text x="24" y="183" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">Connect Gmail over OAuth + IMAP, group by sender,</text><text x="24" y="202" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">block in bulk. Nothing is ever deleted.</text>
